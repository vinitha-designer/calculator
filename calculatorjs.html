<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    button{
      margin: 5px;
      padding: 10px;
      border-radius: 20%;
      border: 1px solid white;
      box-shadow: 2px 2px 20px rgb(73, 71, 71);
    }
    .container{
      width: 20%;
      background-color: rgb(63, 60, 60);
    }
    .btn1{
      padding: 12px;
    }
    .btn2{
      padding: 4px;
      padding-bottom: 12px;
      padding-top: 12px;

    }
    .btn3{
      padding-right: 13px;
    }.btn{
      padding-right: 18px;
    }
    input{
      align-content: end;
      height: 50px;
      margin: 2px;
      padding-right: 3px;
  /* border: none; */
    }
     </style>
</head>
<body>
  <center>
  <h3>Calculator</h3>
  <div class="container">
  <div>
  <input type="text" id="checkoutput" placeholder="0">
</div>
  <div>
    <button class="btn1" onclick="display('(')">(</button>
    <button class="btn1" onclick="display(')')">)</button>
    <button class="btn2" onclick="Clear()">AC</button>
    <button class="btn2" onclick="del()">Del</button>
   </div>
   <div>
    <button onclick="display('7')">7</button>
    <button onclick="display('8')">8</button>
    <button onclick="display('9')">9</button>
    <button class="btn3" onclick="display('0')">0</button>
   </div>
   <div>
    <button onclick="display('4')">4</button>
    <button onclick="display('5')">5</button>
    <button onclick="display('6')">6</button>
    <button class="btn" onclick="display('.')">.</button>

   </div>
   <div>
    <button onclick="display('1')">1</button>
    <button onclick="display('2')">2</button>
    <button onclick="display('3')">3</button>
    <button class="btn3" onclick="calculate()">=</button>
  </div>
  <div>
    <button class="btn3" onclick="display('/')">/</button>
    <button class="btn3" onclick="display('*')">*</button>
    <button class="btn3" onclick="display('-')">-</button>
    <button class="btn3" onclick="display('+')">+</button>
    </div>
  </div>
  </center>
  <script>
    let output=document.getElementById("checkoutput"); 
    function display(num){
     output.value+=num;
    }
    function calculate(){
      try{
      output.value=eval(output.value);
    }
    catch(error){
      alert("invalid");
    }
    }
    function Clear(){
      output.value = "";
    }
    function del(){
      output.value=output.value.slice(0,-1);
    }
  </script>
